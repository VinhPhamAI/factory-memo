services:
  agent-setup:
    image: local/denso-agent:dev
    build:
      context: ../agent
    command: ["denso-agent", "setup-db"]
    environment:
      AGENT_BOOTSTRAP_DATABASE_URL: ${AGENT_CONTAINER_BOOTSTRAP_DATABASE_URL:?Set the container bootstrap URL}
      AGENT_SETUP_DATABASE_URL: ${AGENT_CONTAINER_SETUP_DATABASE_URL:?Set the container setup URL}
      AGENT_DATABASE_URL: ${AGENT_CONTAINER_DATABASE_URL:?Set the container runtime URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    image: local/denso-agent:dev
    build:
      context: ../agent
    command: ["denso-agent", "serve", "--host", "0.0.0.0"]
    environment:
      AGENT_DATABASE_URL: ${AGENT_CONTAINER_DATABASE_URL:?Set the container runtime URL}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?Set a service token}
      MODELARK_API_KEY: ${MODELARK_API_KEY:?Set the provider key}
      MODELARK_BASE_URL: ${MODELARK_BASE_URL:?Set the provider base URL}
      MODELARK_MODEL: ${MODELARK_MODEL:?Set the provider model}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-120}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-1024}
      AGENT_MAX_CONCURRENT_REQUESTS: ${AGENT_MAX_CONCURRENT_REQUESTS:-4}
      AGENT_CONTEXT_MAX_MESSAGES: ${AGENT_CONTEXT_MAX_MESSAGES:-40}
      AGENT_CONTEXT_MAX_CHARACTERS: ${AGENT_CONTEXT_MAX_CHARACTERS:-60000}
      AGENT_SEARCH_TIMEOUT_SECONDS: ${AGENT_SEARCH_TIMEOUT_SECONDS:-10}
      AGENT_SEARCH_MAX_RESULTS: ${AGENT_SEARCH_MAX_RESULTS:-5}
      AGENT_SEARCH_MAX_EXCERPT_CHARACTERS: ${AGENT_SEARCH_MAX_EXCERPT_CHARACTERS:-1500}
      AGENT_HISTORY_MAX_MESSAGES: ${AGENT_HISTORY_MAX_MESSAGES:-200}
      AGENT_HISTORY_MAX_CHARACTERS: ${AGENT_HISTORY_MAX_CHARACTERS:-400000}
    ports:
      - "127.0.0.1:${AGENT_PORT:-8010}:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      agent-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

name: knowledge-agent

services:
  api:
    build:
      context: ..
      dockerfile: deployments/api.Dockerfile
    image: local/knowledge-agent-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Host .env URLs use localhost; containers use Compose service names.
      DATABASE_URL: "${API_DATABASE_URL:-postgresql+psycopg://voice_agent:voice_agent@postgres:5432/voice_agent}"
      SPEECH_API_URL: "${API_SPEECH_API_URL:-http://speech-api:8080}"
      VOICE_AUDIO_DIR: /app/data/audio
      DOCUMENT_UPLOAD_DIR: /app/data/uploads
    ports:
      - "${API_PORT:-8005}:8005"
    volumes:
      - ../data:/app/data
      - document_uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Job workers: one container, one process per stage slot (convert, extract).
  # They consume the ingestion_jobs queue in DATABASE_URL (LISTEN/NOTIFY with a
  # polling fallback); scale a stage with WORKER_<STAGE>_PROCESSES.
  worker:
    image: local/knowledge-agent-api
    build:
      context: ..
      dockerfile: deployments/api.Dockerfile
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: "${API_DATABASE_URL:-postgresql+psycopg://voice_agent:voice_agent@postgres:5432/voice_agent}"
      VOICE_AUDIO_DIR: /app/data/audio
      DOCUMENT_UPLOAD_DIR: /app/data/uploads
    volumes:
      - ../data:/app/data
      - document_uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # Running jobs get WORKER_SHUTDOWN_GRACE_S (default 90 s) to finish before
    # they are handed back to the queue.
    stop_grace_period: 2m

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voice_agent
      POSTGRES_PASSWORD: voice_agent
      POSTGRES_DB: voice_agent
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agent -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NeMo-Speech.cpp: Nemotron 3.5 streaming ASR + Nemotron 3 diarization with
  # server-side end-of-utterance detection. Fetch the source and models first
  speech-api:
    profiles: ["speech"]
    build:
      context: ./NeMo-Speech.cpp
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        ENABLE_CUDA: "ON"
        ENABLE_HTTP: "ON"
        ENABLE_GRPC: "OFF"
        ENABLE_FLASHLIGHT: "OFF"
        ENABLE_NORM: "OFF"
        ENABLE_NMT: "OFF"
        ENABLE_S2S: "OFF"
        # A40 = sm_86; 
        CUDA_ARCH: "${SPEECH_CUDA_ARCH:-86}"
    image: local/nemo-speech:cuda
    container_name: speech-api
    restart: unless-stopped
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --access-log
      # Speech-to-text
      - --asr.model.path
      - /models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      # Speaker diarization: adds speaker IDs to ASR words when requested
      - --asr.diar.model_path
      - /models/Nemotron-3-Diarization.q8_0.gguf
      # End-of-utterance detection (trailing silence, ms); clients may
      # override it per session with `endpointing_ms`.
      - --asr.endpointing.enable=true
      - --asr.endpointing.stop_history_eou_ms
      - "${SPEECH_EOU_MS:-800}"
    ports:
      - "127.0.0.1:${SPEECH_API_PORT:-8080}:8080"
    volumes:
      - ../models/nemo-speech:/models:ro
    shm_size: "4gb"
    healthcheck:
      # The runtime image is FROM scratch (no shell or curl).
      test: ["CMD", "/opt/nemo-speech/bin/nemo-speech", "health", "--url", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPEECH_GPU_ID:-0}"]
              capabilities: [gpu]

volumes:
  pgdata:
  document_uploads:

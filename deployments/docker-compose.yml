name: knowledge-agent

services:
  api:
    build:
      context: ..
      dockerfile: deployments/api.Dockerfile
    image: local/knowledge-agent-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Host .env URLs use localhost; containers use Compose service names.
      DATABASE_URL: "${API_DATABASE_URL:-postgresql+psycopg://voice_agent:voice_agent@postgres:5432/voice_agent}"
      # Shared application tables for auth, conversations, files and knowledge; migrations run separately.
      APP_DATABASE_URL: "${API_APP_DATABASE_URL:-postgresql+psycopg://voice_agent:voice_agent@postgres:5432/voice_agent_app}"
      SPEECH_API_URL: "${API_SPEECH_API_URL:-http://ai-services-api:8080}"
      # Native agent on the host by default; http://agent:8010 with agent.compose.yml. Token from .env.
      AGENT_BASE_URL: "${API_AGENT_BASE_URL:-http://host.docker.internal:8010}"
      VOICE_AUDIO_DIR: /app/data/audio
      DOCUMENT_UPLOAD_DIR: /app/data/uploads
      FILE_LIBRARY_DIR: /app/data/files
    ports:
      - "${API_PORT:-8005}:8005"
    volumes:
      - ../data:/app/data
      - document_uploads:/app/data/uploads
      # Personal file library (/v1/files); only the API reads it.
      - file_library:/app/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Job workers: one container, one process per stage slot (convert, extract, conflict).
  # They consume the ingestion_jobs queue in APP_DATABASE_URL (LISTEN/NOTIFY with a
  # polling fallback); scale a stage with WORKER_<STAGE>_PROCESSES.
  worker:
    image: local/knowledge-agent-api
    build:
      context: ..
      dockerfile: deployments/api.Dockerfile
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: "${API_DATABASE_URL:-postgresql+psycopg://voice_agent:voice_agent@postgres:5432/voice_agent}"
      APP_DATABASE_URL: "${API_APP_DATABASE_URL:-postgresql+psycopg://voice_agent:voice_agent@postgres:5432/voice_agent_app}"
      VOICE_AUDIO_DIR: /app/data/audio
      DOCUMENT_UPLOAD_DIR: /app/data/uploads
      OCR_API_URL: "${OCR_API_URL:-}"
      OCR_API_KEY: "${OCR_API_KEY:-}"
      OCR_TIMEOUT_S: "${OCR_TIMEOUT_S:-}"
      OCR_DOC_ORIENTATION: "${OCR_DOC_ORIENTATION:-}"
    volumes:
      - ../data:/app/data
      - document_uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # Running jobs get WORKER_SHUTDOWN_GRACE_S (default 90 s) to finish before
    # they are handed back to the queue.
    stop_grace_period: 2m

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voice_agent
      POSTGRES_PASSWORD: voice_agent
      POSTGRES_DB: voice_agent
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agent -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  document_uploads:
  file_library:

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expert Knowledge Management Architecture</title>

<style>
  :root {
    --fs-scale: 1;
    --fs-section: 16;
    --fs-node-title: 14;
    --fs-node-sub: 12;
    --fs-kb-title: 16;
    --fs-group-title: 11;
    --line-height: 1.2;
    --pad-x: 6;
    --pad-y: 3;
    --blue: #6699ff;
    --blue-fill: #d4e3f8;
    --green: #82b366;
    --orange: #ffab40;
    --red: #ff6666;
    --red-fill: #f4cccc;
    --purple: #9673d4;
    --purple-fill: #dcd0e6;
    --teal: #55bbaa;
    --ink: #222;
    --ink-soft: #3d3d3d;
    --arrow-blue: #2860ce;
    --arrow-green: #269d50;
    --arrow-red: #ed3535;
    --arrow-purple: #8a35ee;
  }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px 10px; background: #fff; }
  .diagram-wrapper { width: 100%; overflow-x: auto; }
  svg {
    display: block;
    width: 100%;
    min-width: 1100px;
    max-width: 1600px;
    height: auto;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-family: Arial, Helvetica, sans-serif;
  }
  text { text-anchor: middle; dominant-baseline: central; }
  .start { text-anchor: start; }
  .st { font-size: calc(var(--fs-section) * var(--fs-scale) * 1px); font-weight: 700; text-anchor: start; }
  .t { font-size: calc(var(--fs-node-title) * var(--fs-scale) * 1px); font-weight: 700; fill: var(--ink); }
  .s { font-size: calc(var(--fs-node-sub) * var(--fs-scale) * 1px); fill: var(--ink-soft); }
  .kb { font-size: calc(var(--fs-kb-title) * var(--fs-scale) * 1px); font-weight: 700; fill: var(--ink); }
  .gt { font-size: calc(var(--fs-group-title) * var(--fs-scale) * 1px); font-weight: 700; fill: #188338; }
  .seed-label { font-size: 11px; font-weight: 700; fill: var(--arrow-purple); }

  .sec { stroke-width: 0.7; }
  .sec.blue { fill: #e9f1fc; stroke: var(--blue); }
  .sec.query { fill: #edf2fb; stroke: var(--blue); }
  .sec.green { fill: #eef6ec; stroke: var(--green); }
  .sec.orange { fill: #fff5e5; stroke: var(--orange); }
  .sec.teal { fill: #e8f5f3; stroke: var(--teal); }
  .sec.purple { fill: #f5effc; stroke: none; }
  .st.blue, .st.query { fill: #1b4f99; }
  .st.green { fill: #226629; }
  .st.orange { fill: #c63e0b; }
  .st.teal { fill: #16776b; }
  .st.purple { fill: #6030a0; }

  .node { stroke-width: 0.7; }
  .n-blue { fill: var(--blue-fill); stroke: var(--blue); }
  .n-bluew { fill: #fff; stroke: var(--blue); }
  .n-greenw { fill: #fff; stroke: var(--green); }
  .n-orangew { fill: #fff; stroke: var(--orange); }
  .n-purplew { fill: #fff; stroke: var(--purple); }
  .n-red { fill: var(--red-fill); stroke: var(--red); }
  .n-purple { fill: var(--purple-fill); stroke: var(--purple); }
  .node.overflow { stroke: #f00; stroke-width: 3; }
  .grp { fill: none; stroke: var(--arrow-green); stroke-width: 1.2; stroke-dasharray: 6 4; }
  .db, .db-top { stroke: #4c89ed; stroke-width: 0.7; }
  .db { fill: var(--blue-fill); }
  .db-top { fill: none; }
  .a { fill: none; stroke-width: 1.3; stroke-linejoin: round; }
  .a-blue { stroke: var(--arrow-blue); marker-end: url(#h-blue); }
  .a-green { stroke: var(--arrow-green); marker-end: url(#h-green); }
  .a-red { stroke: var(--arrow-red); marker-end: url(#h-red); }
  .a-purple { stroke: var(--arrow-purple); marker-end: url(#h-purple); }
  .a.nohead { marker-end: none; }
  .a.dashed { stroke-dasharray: 6 4; }
</style>
</head>

<body>
<div class="diagram-wrapper">
<svg id="d" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Kiến trúc hệ thống quản lý tri thức chuyên gia</title>
  <desc id="diagram-description">Sơ đồ tham chiếu: khởi tạo tri thức, xử lý nguồn đầu vào, trích xuất tri thức có cấu trúc, kho tri thức, tổng hợp báo cáo và truy vấn tái sử dụng tri thức.</desc>
  <defs></defs>
</svg>
</div>

<script>
/* ====================================================================
   LAYOUT  — plain numbers; every connector is derived from node rects.
   ==================================================================== */
const W = 1600, H = 675;
const TOP = 86, BOT = 508;
const QY = 519, QH = 147;

/* ---------- helpers ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('d');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

const cs = getComputedStyle(document.documentElement);
const cssNum = n => parseFloat(cs.getPropertyValue(n));
const SCALE = cssNum('--fs-scale');
const fs = n => cssNum('--fs-' + n) * SCALE;
const LH = cssNum('--line-height');
const PADX = cssNum('--pad-x'), PADY = cssNum('--pad-y');
const FAMILY = 'Arial, Helvetica, sans-serif';
const ctx = document.createElement('canvas').getContext('2d');
const textW = (s, size, bold) => { ctx.font = `${bold ? 700 : 400} ${size}px ${FAMILY}`; return ctx.measureText(s).width; };

function el(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  svg.appendChild(e);
  return e;
}

// Greedy word-wrap. Arrays are used as-is (explicit line breaks).
function wrap(text, size, bold, maxW) {
  if (Array.isArray(text)) return text;
  const lines = []; let cur = '';
  for (const w of String(text).split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && textW(t, size, bold) > maxW) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

const N = {};                 // id -> {x,y,w,h,cx,cy}
const checks = [];            // overflow checks, run after render
const L = (id, dy = 0) => [N[id].x, N[id].cy + dy];
const R = (id, dy = 0) => [N[id].x + N[id].w, N[id].cy + dy];
const T = (id, dx = 0) => [N[id].cx + dx, N[id].y];
const B = (id, dx = 0) => [N[id].cx + dx, N[id].y + N[id].h];

/* ---------- primitives ---------- */
function section(x, y, w, h, cls, title, titleOffset = 20) {
  el('rect', { class: `sec ${cls}`, x, y, width: w, height: h, rx: 7 });
  el('text', { class: `st ${cls}`, x: x + 14, y: y + titleOffset }, title);
}

function node(id, x, y, w, h, title, sub = [], cls = 'bluew') {
  const tS = fs('node-title'), sS = fs('node-sub');
  const maxW = w - 2 * PADX;
  const tl = wrap(title, tS, true, maxW), sl = wrap(sub, sS, false, maxW);
  const tH = tS * LH, sH = sS * LH, gap = sl.length ? tS * 0.3 : 0;
  const total = tH * tl.length + gap + sH * sl.length;
  let cy = y + (h - total) / 2;
  const rect = el('rect', { class: `node n-${cls}`, x, y, width: w, height: h, rx: 3 });
  const texts = [];
  const cx = x + w / 2;
  tl.forEach(l => { texts.push(el('text', { class: 't', x: cx, y: cy + tH / 2 }, l)); cy += tH; });
  cy += gap;
  sl.forEach(l => { texts.push(el('text', { class: 's', x: cx, y: cy + sH / 2 }, l)); cy += sH; });
  N[id] = { x, y, w, h, cx, cy: y + h / 2 };
  checks.push({ id, rect, texts, x, y, w, h });
}

function bullet(x, y, text) {
  el('text', { class: 's start', x, y }, '•');
  return el('text', { class: 's start', x: x + 13, y }, text);
}

function path(pts, kind = 'blue', o = {}) {
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join(' ');
  el('path', { class: `a a-${kind}${o.dashed ? ' dashed' : ''}${o.nohead ? ' nohead' : ''}`, d });
}

// arrow-head markers
const defs = svg.querySelector('defs');
for (const [k, c] of Object.entries({ blue: '--arrow-blue', green: '--arrow-green', red: '--arrow-red', purple: '--arrow-purple' })) {
  const m = document.createElementNS(NS, 'marker');
  Object.entries({ id: `h-${k}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto' })
    .forEach(([a, v]) => m.setAttribute(a, v));
  m.innerHTML = `<path d="M0 0 L10 5 L0 10 z" fill="${cs.getPropertyValue(c).trim()}"/>`;
  defs.appendChild(m);
}

/* ====================================================================
   DIAGRAM
   ==================================================================== */
/* ---------- section frames ---------- */
const DE_X = 1068, DE_W = 518;
section(14, 11, W - 28, 65, 'purple', 'Khởi tạo tri thức', 32);
section(14, TOP, 206, BOT - TOP, 'blue', 'Nguồn đầu vào');
section(253, TOP, 405, BOT - TOP, 'green', 'Xử lý đầu vào');
section(691, TOP, 344, BOT - TOP, 'orange', 'Trích xuất tri thức có cấu trúc');
section(DE_X, TOP, DE_W, 193, 'green', 'Kho tri thức');
section(DE_X, 290, DE_W, 218, 'teal', 'Tổng hợp & báo cáo');
section(14, QY, W - 28, QH, 'query', 'Truy vấn và tái sử dụng tri thức');

/* ---------- bootstrap band ---------- */
node('sop', 303, 20, 266, 47, 'SOP Ingestor', 'Parse Machine / Job / Step', 'purplew');
node('seed', 596, 20, 266, 47, 'Seed Document Processor', 'Seed subject & procedures', 'purplew');
node('reg', 890, 20, 266, 47, 'Catalog Registry', 'Quản lý danh mục máy và linh kiện', 'purplew');
path([R('sop'), L('seed')]);
path([R('seed'), L('reg')]);

/* ---------- sources and input processing ---------- */
const ROW = [177, 286, 396];
node('in1', 29, 162, 176, 31, 'Giọng nói chuyên gia');
node('in2', 29, 271, 176, 31, 'Ghi chú / tài liệu');
node('in3', 29, 371, 176, 49, 'Metadata ngữ cảnh', 'QR · timestamp · expert ID');
node('ifc', 267, 158, 86, 257, ['Input', 'Interface'], [], 'blue');
node('stt', 378, 162, 132, 31, 'STT', [], 'greenw');
node('ocr', 378, 262, 132, 50, ['OCR / Document', 'Processor'], [], 'greenw');
node('mex', 378, 371, 132, 50, ['Metadata', 'Extractor'], [], 'greenw');
node('raw', 534, 238, 109, 98, ['Raw content', '+ metadata'], [], 'blue');
node('obj', 518, 421, 131, 31, 'Object Storage', [], 'blue');
for (const y of ROW) {
  path([[205, y], [267, y]]);
  path([[353, y], [378, y]]);
}
path([R('stt'), [522, N.stt.cy], [522, 253], L('raw', -34)]);
path([R('ocr'), L('raw')]);
path([R('mex'), [522, N.mex.cy], [522, 321], L('raw', 34)]);
path([B('raw'), T('obj', N.raw.cx - N.obj.cx)]);

/* ---------- structured knowledge extraction ---------- */
const CX = 705, CW = 315;
node('ext', CX, 132, CW, 47, 'Knowledge Extractor', 'LLM → Knowledge Items', 'orangew');
node('sub', CX, 198, CW, 47, 'Subject Resolution', 'Match / create subject', 'orangew');
node('can', CX, 263, CW, 47, 'Candidate Matching', 'Field rules + retrieval', 'orangew');
node('cmp', CX, 329, 186, 47, 'Knowledge Comparison', 'Same / Compatible / Conflict', 'orangew');
node('cas', 913, 329, 107, 47, 'Case Builder', 'Case Card', 'red');
node('exp', CX, 394, CW, 33, 'Expert Review', [], 'orangew');
node('wri', CX, 446, CW, 47, 'Knowledge Writer', 'Insert / update + revision history', 'orangew');
path([R('raw'), [674, N.raw.cy], [674, N.ext.cy], L('ext')]);
path([B('ext'), T('sub')]);
path([B('sub'), T('can')]);
path([B('can', N.cmp.cx - N.can.cx), T('cmp')]);
path([R('cmp'), L('cas')], 'red');
path([B('cas'), T('exp', N.cas.cx - N.exp.cx)], 'red');
path([B('exp'), T('wri')]);

/* ---------- knowledge base ---------- */
const KB = { cx: 1327, rx: 177, ry: 11, top: 133, bot: 254 };
const { cx: kcx, rx: krx, ry: kry, top: ktop, bot: kbot } = KB;
const KB_L = kcx - krx, KB_R = kcx + krx;
el('path', { class: 'db', d: `M${KB_L} ${ktop} A${krx} ${kry} 0 0 1 ${KB_R} ${ktop} V${kbot} A${krx} ${kry} 0 0 1 ${KB_L} ${kbot} Z` });
el('path', { class: 'db-top', d: `M${KB_L} ${ktop} A${krx} ${kry} 0 0 0 ${KB_R} ${ktop}` });
el('text', { class: 'kb', x: kcx, y: 155 }, 'Knowledge Base');
el('text', { class: 's', x: kcx, y: 177, style: 'font-size: 14px' }, 'PostgreSQL + pgvector');
['Case Cards', 'Evidence', 'Revision history'].forEach((line, i) => bullet(1178, 205 + i * 14, line));
['SOP links', 'Subject Reports'].forEach((line, i) => bullet(1347, 205 + i * 14, line));

/* ---------- aggregation and reporting ---------- */
node('chk', 1181, 330, 292, 29, 'Check data change');
node('gen', 1181, 374, 292, 29, 'Subject Report Generator');
const EX = 1082, SRY = 417, EW = 490, SRH = 80;
const srRect = el('rect', { class: 'node n-bluew', x: EX, y: SRY, width: EW, height: SRH, rx: 3 });
N.rep = { x: EX, y: SRY, w: EW, h: SRH, cx: EX + EW / 2, cy: SRY + SRH / 2 };
const srTexts = [el('text', { class: 't', x: N.rep.cx, y: 432 }, 'Structured Subject Report')];
const reportColumns = [
  { x: 1102, lines: ['Best Practices', 'Heuristics', 'Procedures'] },
  { x: 1266, lines: ['Known Cases', 'Constraints', 'Conditions'] },
  { x: 1430, lines: ['Conflicts', 'Supporting Evidence'] },
];
for (const column of reportColumns) {
  column.lines.forEach((line, i) => {
    const text = bullet(column.x, 454 + i * 13, line);
    text.setAttribute('style', 'font-size: 11px');
    srTexts.push(text);
  });
}
checks.push({ id: 'rep', rect: srRect, texts: srTexts, x: EX, y: SRY, w: EW, h: SRH });
path([[kcx, kbot + kry], T('chk')]);
path([B('chk'), T('gen')]);
path([B('gen'), T('rep')]);
path([R('rep'), [1580, N.rep.cy], [1580, 192], [KB_R, 192]]);
path([R('wri'), [1042, N.wri.cy], [1042, 177], [KB_L, 177]]);
path([R('reg'), [kcx, N.reg.cy], [kcx, ktop - kry]], 'purple', { dashed: true });
el('text', { class: 'seed-label', x: 1242, y: 32 }, 'seed data');

/* ---------- knowledge query and reuse ---------- */
const GX = 774, GY = 558, GW = 195, GH = 103;
const MY = 611, T1 = 598, T2 = 638;
node('usr', 29, 587, 177, 49, 'Người dùng truy vấn', 'Voice / text', 'purple');
node('qst', 241, 596, 61, 31, 'STT');
node('nlq', 338, 586, 141, 50, ['Natural-language', 'query']);
node('orc', 525, 586, 195, 50, ['Reasoning & Retrieval', 'Agent'], [], 'red');
el('rect', { class: 'grp', x: GX, y: GY, width: GW, height: GH });
el('text', { class: 'gt', x: GX + GW / 2, y: GY + 12 }, 'Truy vấn trên Knowledge Base');
node('sql', 789, 582, 166, 31, 'Text-to-SQL');
node('rag', 789, 622, 166, 31, 'RAG');
node('llm', 1041, 586, 195, 50, ['LLM Answer / Report', 'Generation']);
node('ans', 1299, 587, 275, 49, 'Câu trả lời / báo cáo', 'Subject report, cases, trích dẫn', 'purple');
path([R('usr'), L('qst')]);
path([R('qst'), L('nlq')]);
path([R('nlq'), L('orc')]);
const TR = 751, MG = 1005;
path([R('orc'), [TR, MY], [TR, T1], L('sql')]);
path([R('orc'), [TR, MY], [TR, T2], L('rag')]);
path([R('sql'), [MG, T1], [MG, MY], L('llm')]);
path([R('rag'), [MG, T2], [MG, MY]], 'blue', { nohead: true });
path([R('llm'), L('ans')]);
path([[GX + GW / 2, GY], [GX + GW / 2, 537], [1056, 537], [1056, 216], [KB_L, 216]], 'green', { dashed: true });

/* ---------- overflow check (outline red with ?debug) ---------- */
const bad = [];
for (const c of checks) {
  for (const t of c.texts) {
    const b = t.getBBox();
    if (b.x < c.x + PADX || b.x + b.width > c.x + c.w - PADX || b.y < c.y + PADY || b.y + b.height > c.y + c.h - PADY) {
      bad.push(`${c.id}: "${t.textContent}"`); c.rect.classList.add(location.search.includes('debug') ? 'overflow' : 'ov'); break;
    }
  }
}
if (bad.length) console.warn('Text overflow in:\n' + bad.join('\n'));
window.__overflow = bad;
</script>
</body>
</html>

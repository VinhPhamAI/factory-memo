  :root {

    --fs-title: 28;           /* page title */
    --fs-zone: 18;            /* zone heading (deployment boundary) */
    --fs-section-sub: 13.5;   /* zone subtitle */
    --fs-node-title: 16;      /* component heading (bold) */
    --fs-node-sub: 13.5;      /* component description */
    --fs-chip: 12.5;          /* module chips inside a component */
    --fs-label: 12.5;         /* arrow labels */
    --fs-cap: 12;             /* small captions */

    --line-height: 1.22;      /* line spacing (× font size) */
    --pad-x: 8;               /* min horizontal gap between text and node edge (px) */
    --pad-y: 4;               /* min vertical gap between text and node edge (px) */

    --green: #82b366; --green-fill: #e3f1dc;
    --orange:#d79b00;
    --red:   #b85450; --red-fill:   #f8cecc;
    --purple:#9673a6; --purple-fill:#e1d5e7;
    --teal:  #5fb3ad;
    --ink: #1f2d3d; --ink-soft: #4d5d6e;

  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #f5f6f8; }
  .diagram-wrapper { width: 100%; overflow-x: auto; }

    background: #fff; border: 1px solid #dde3ea;

  text { text-anchor: middle; dominant-baseline: central; }

  .title   { font-size: calc(var(--fs-title) * var(--fs-scale) * 1px); font-weight: 700; fill: #1f4e8c; }

  .t       { font-size: calc(var(--fs-node-title) * var(--fs-scale) * 1px); font-weight: 700; fill: var(--ink); }
  .s       { font-size: calc(var(--fs-node-sub) * var(--fs-scale) * 1px); fill: var(--ink-soft); }
  .ct      { font-size: calc(var(--fs-chip) * var(--fs-scale) * 1px); fill: var(--ink); }
  .lb      { font-size: calc(var(--fs-label) * var(--fs-scale) * 1px); font-weight: 600; }
  .cap     { font-size: calc(var(--fs-cap) * var(--fs-scale) * 1px); fill: #6b7a8a; font-style: italic; }

  /* zones (deployment boundaries) */
  .sec { stroke-width: 1.5; }
  .sec.blue   { fill: #f1f6fc; stroke: var(--blue); }
  .sec.orange { fill: #fff8ee; stroke: var(--orange); }
  .sec.teal   { fill: #eef9f8; stroke: var(--teal); }
  .sec.purple { fill: #f8f3fc; stroke: var(--purple); stroke-dasharray: 7 4; }
  .sec.plain  { fill: #fff; stroke: #c9d2dc; }
  .zt.blue { fill: #1f4e8c; } .zt.orange { fill: #a8531a; } .zt.teal { fill: #1b6b68; }
  .zt.purple { fill: #5b2d91; } .zt.plain { fill: var(--ink); }

  /* components */
  .node { stroke-width: 1.5; }
  .n-bluew   { fill: #fff;               stroke: var(--blue); }
  .n-orangew { fill: #fff;               stroke: var(--orange); }
  .n-tealw   { fill: #fff;               stroke: var(--teal); }
  .n-teal    { fill: #d8f0ee;            stroke: var(--teal); }
  .n-purplew { fill: #fff;               stroke: var(--purple); }
  .n-purple  { fill: var(--purple-fill); stroke: var(--purple); }
  .node.overflow { stroke: #ff0000; stroke-width: 3; }

  .chip { fill: #f3f5f8; stroke: #b9c4d0; stroke-width: 1; }
  .chip.tool { fill: #fff3df; stroke: var(--orange); }
  .chip.dbc  { fill: #fff; stroke: var(--blue); }
  .kbbox { fill: var(--green-fill); stroke: var(--green); stroke-width: 1.5; }
  .db, .db-top, .fold { stroke: var(--blue); stroke-width: 1.5; }
  .db, .fold { fill: var(--blue-fill); } .db-top { fill: none; }

  /* connectors */
  .a { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .a-blue   { stroke: var(--arrow-blue);   marker-end: url(#h-blue); }
  .a-green  { stroke: var(--arrow-green);  marker-end: url(#h-green); }
  .a-red    { stroke: var(--arrow-red);    marker-end: url(#h-red); }
  .a-purple { stroke: var(--arrow-purple); marker-end: url(#h-purple); }
  .a.nohead { marker-end: none; }
  .a.dashed { stroke-dasharray: 7 5; }
  .l-blue { fill: var(--arrow-blue); } .l-green { fill: var(--arrow-green); }
  .l-purple { fill: var(--arrow-purple); }
</style>

function zone(x, y, w, h, cls, title, sub, logos = []) {
  el('rect', { class: `sec ${cls}`, x, y, width: w, height: h, rx: 12 });
  const tx = x + 16 + icons(logos, x + 16, y + 13, 22, 7);
  el('text', { class: `zt ${cls}`, x: tx, y: y + 24 }, title);
  if (sub) el('text', { class: 'ss', x: tx + textW(title, fs('zone'), true) + 10, y: y + 25 }, sub);
}

// component card: logo row on top, left-aligned title and description lines.
// Returns the y where extra content (chips, tool rows) may start.
function card(id, x, y, w, h, cls, logos, title, sub = []) {
  const rect = el('rect', { class: `node n-${cls}`, x, y, width: w, height: h, rx: 8 });
  const tS = fs('node-title'), sS = fs('node-sub'), px = x + 14, texts = [];
  let cy = y + 12;
  if (logos.length) { icons(logos, px, cy); cy += 32; }
  texts.push(el('text', { class: 't start', x: px, y: cy + tS * LH / 2 }, title)); cy += tS * LH + 2;
  for (const l of [].concat(sub)) { texts.push(el('text', { class: 's start', x: px, y: cy + sS * LH / 2 }, l)); cy += sS * LH; }
  reg(id, x, y, w, h);
  checks.push({ id, rect, texts, x, y, w, h });
  return cy + 8;
}

// compact component: one logo on the left, text on the right, centred vertically
function sideCard(id, x, y, w, h, cls, logo, title, sub = []) {
  const rect = el('rect', { class: `node n-${cls}`, x, y, width: w, height: h, rx: 8 });
  const tS = fs('node-title'), sS = fs('node-sub'), subs = [].concat(sub), texts = [];
  icon(logo, x + 14, y + (h - 28) / 2, 28);
  let cy = y + (h - tS * LH - subs.length * sS * LH) / 2;
  texts.push(el('text', { class: 't start', x: x + 54, y: cy + tS * LH / 2 }, title)); cy += tS * LH;
  for (const l of subs) { texts.push(el('text', { class: 's start', x: x + 54, y: cy + sS * LH / 2 }, l)); cy += sS * LH; }
  reg(id, x, y, w, h);
  checks.push({ id, rect, texts, x, y, w, h });
}

// human actor: person glyph + role
function actor(id, x, y, w, h, title, sub) {
  const rect = el('rect', { class: 'node n-purple', x, y, width: w, height: h, rx: 8 });
  const cx = x + w / 2;
  el('circle', { cx, cy: y + 17, r: 8, fill: '#7b5a8c' });
  el('path', { d: `M${cx - 15} ${y + 45} a15 15 0 0 1 30 0 z`, fill: '#7b5a8c' });
  const texts = [el('text', { class: 't', x: cx, y: y + 61 }, title), el('text', { class: 's', x: cx, y: y + 80 }, sub)];
  reg(id, x, y, w, h);
  checks.push({ id, rect, texts, x, y, w, h });
}

// pill chips flowing left to right, wrapping at maxW; '→' is drawn as plain text. Returns the bottom y.
function chips(x, y, maxW, items, cls = '') {
  const size = fs('chip'), hgt = 24, gap = 6;
  let cx = x, cy = y;
  for (const it of items) {
    const arrow = it === '→';
    const w = arrow ? 12 : textW(it, size, false) + 18;
    if (cx > x && cx + w > x + maxW) { cx = x; cy += hgt + gap; }
    if (!arrow) el('rect', { class: `chip ${cls}`, x: cx, y: cy, width: w, height: hgt, rx: 12 });
    el('text', { class: 'ct', x: cx + w / 2, y: cy + hgt / 2 + 0.5 }, it);
    cx += w + gap;
  }
  return cy + hgt;
}
// one centred row of chips
function chipsCentered(cx, y, items, cls = '') {
  const total = items.reduce((a, it) => a + textW(it, fs('chip'), false) + 18, 0) + 6 * (items.length - 1);
  return chips(cx - total / 2, y, total + 1, items, cls);
}

// full-width row inside a card (a screen, or an agent tool when glyph is set)
function row(x, y, w, text, glyph) {
  el('rect', { class: `chip${glyph ? ' tool' : ''}`, x, y, width: w, height: 30, rx: 6 });
  if (glyph) { icon(glyph, x + 9, y + 7, 16); el('text', { class: 'ct start', x: x + 33, y: y + 15.5 }, text); }
  else el('text', { class: 'ct', x: x + w / 2, y: y + 15.5 }, text);
}

// database cylinder; registers N[id] as its bounding box (rims included)
function cylinder(id, cx, top, rx, ry, bodyH) {
  const bot = top + bodyH;
  el('path', { class: 'db', d: `M${cx - rx} ${top} A${rx} ${ry} 0 0 1 ${cx + rx} ${top} V${bot} A${rx} ${ry} 0 0 1 ${cx - rx} ${bot} Z` });
  el('path', { class: 'db-top', d: `M${cx - rx} ${top} A${rx} ${ry} 0 0 0 ${cx + rx} ${top}` });
  reg(id, cx - rx, top - ry, 2 * rx, bodyH + 2 * ry);
}

// file-storage folder; N[id] is the folder body (the tab sits above it)
function folder(id, x, y, w, h, tab = 12) {
  el('path', { class: 'fold', d: `M${x} ${y - tab} H${x + w * 0.4} L${x + w * 0.4 + 10} ${y} H${x + w} V${y + h} H${x} Z` });
  reg(id, x, y, w, h);
}

// orthogonal polyline arrow. kind: blue | green | red | purple; o.dashed, o.nohead
function path(pts, kind = 'blue', o = {}) {
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join(' ');
  el('path', { class: `a a-${kind}${o.dashed ? ' dashed' : ''}${o.nohead ? ' nohead' : ''}`, d });
}

function label(x, y, text, kind = 'blue', anchor = 'middle') {
  el('text', { class: `lb l-${kind}${anchor === 'start' ? ' start' : ''}`, x, y }, text);
}
const txt = (cls, x, y, text) => el('text', { class: cls, x, y }, text);

// arrow-head markers
const defs = svg.querySelector('defs');
for (const [k, c] of Object.entries({ blue: '--arrow-blue', green: '--arrow-green', red: '--arrow-red', purple: '--arrow-purple' })) {
  const m = document.createElementNS(NS, 'marker');
  Object.entries({ id: `h-${k}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: 'userSpaceOnUse', orient: 'auto' })
    .forEach(([a, v]) => m.setAttribute(a, v));
  m.innerHTML = `<path d="M0 0 L10 5 L0 10 z" fill="${cs.getPropertyValue(c).trim()}"/>`;
  defs.appendChild(m);
}

/* ---------- overflow check (outline red with ?debug) ---------- */
const bad = [];
for (const c of checks) {
  for (const t of c.texts) {
    const b = t.getBBox();
    if (b.x < c.x + PADX || b.x + b.width > c.x + c.w - PADX || b.y < c.y + PADY || b.y + b.height > c.y + c.h - PADY) {
      bad.push(`${c.id}: "${t.textContent}"`); c.rect.classList.add(location.search.includes('debug') ? 'overflow' : 'ov'); break;
    }
  }
}
if (bad.length) console.warn('Text overflow in:\n' + bad.join('\n'));
window.__overflow = bad;

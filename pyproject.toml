[project]
name = "voice-agent-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=23.1",
    "beir>=2.2.0",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "huggingface-hub>=1.3.0",
    "langchain>=1.3.9",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
    "openai>=2.41.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.3.6",
    "pipecat-ai[cartesia,daily,deepgram,openai,silero]>=1.12.0",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.50.0",
    "uuid-utils>=0.11",
    "uvicorn>=0.34.2",
    "websockets>=16.1.1",
]

# Backend schema migrations: run `uv run alembic upgrade head` from the repo root.
# See docs/development/database-migrations.md.
[tool.alembic]
script_location = "%(here)s/backend/migrations"
prepend_sys_path = ["."]
